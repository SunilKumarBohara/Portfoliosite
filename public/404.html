<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | Sunil Kumar Bohara</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/index.css" />
    <style>
      body {
        margin: 0;
        background-color: #0A0A0A;
        color: #F5F5F5;
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 480px;
        padding: 40px;
        background: #121214;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
      }
      .code {
        font-size: 72px;
        font-weight: 800;
        color: #5B7CFA;
        line-height: 1;
        margin-bottom: 16px;
      }
      p {
        color: #A1A1AA;
        font-size: 15px;
        line-height: 1.6;
        margin-bottom: 24px;
      }
      a {
        display: inline-block;
        padding: 12px 28px;
        background-color: #5B7CFA;
        color: #FFFFFF;
        text-decoration: none;
        font-weight: 600;
        border-radius: 9999px;
        font-size: 14px;
        transition: background-color 0.2s;
      }
      a:hover {
        background-color: #4A6CF7;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="code">404</div>
      <h1 style="font-size: 20px; font-weight: 700; margin-bottom: 8px;">Page Not Found</h1>
      <p>The page you are looking for does not exist or has been moved.</p>
      <a href="/">Return to Home</a>
    </div>
  </body>
</html>
